[package]
name = "input-tip-hook"
version = "0.1.0"
edition = "2024"
description = "注入到目标进程的小钩子：在目标 UI 线程里读 GetCaretPos，经共享内存回传"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }
